# Human-guessed playtests, transcribed for simulated replay and calibration.
# See docs/simulated-playtesting.md. Contains answers: guessers must not read it.
#
# Each game: the prompt as it is now in data/prompts.csv, the source log, the human
# result (solved / failed / skipped), the step it was solved at if the log says, guesses
# the clue-giver answered "Yes" to, extra accepted answers, and the clue lines split
# into steps (one guesser turn after each).
#
# The logs record the final clue sequence, not where each guess turn began. Unless a
# game's note says otherwise, a new step starts at each pawn. Picture-detail comments
# are kept, since the human guesser saw where the marker sat.

[[game]]
prompt = "Pizza"
source = "playtests/2026-11-16-claude-clues.md"
human = "solved"
human_steps = 1
steps = [["?g A14", "+ H4", "+ F8"]]

