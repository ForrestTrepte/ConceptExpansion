# Phase 2 lever: the baseline's games and guesser with first-instinct wording and one guess per turn.
# Compare with calibrate-baseline.
mode = "human-clues"
prompts = [
    "Pizza", "Umbrella", "Penguin", "Food truck", "Selfie", "Lifeguard", "Break the ice",
    "Spider-Man", "Hit the snooze button", "Star Wars", "Drone", "Statue of Liberty",
    "Couch potato", "Elvis Presley", "Popcorn", "Snail", "Lighthouse",
    "Once in a blue moon", "Lego", "Rain check",
]
trials = 3
max_guesses = 1
guesser_prompt = "guesser-instinct"
extra_rounds = 2
concurrency = 5
spend_limit_usd = 3.0

[guesser]
model = "claude-haiku-5-5"
effort = "low"
