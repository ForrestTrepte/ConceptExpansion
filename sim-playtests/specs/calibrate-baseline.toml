# Phase 2 baseline: every game with human guessers and clues on a prompt still in the
# deck (Octopus and Light bulb are rejected; Hit the snooze button is now Snooze
# button), sent to the dry run's guesser. Later guesser changes are compared to this.
mode = "human-clues"
prompts = [
    "Pizza", "Umbrella", "Penguin", "Food truck", "Selfie", "Lifeguard", "Break the ice",
    "Spider-Man", "Hit the snooze button", "Star Wars", "Drone", "Statue of Liberty",
    "Couch potato", "Elvis Presley", "Popcorn", "Snail", "Lighthouse",
    "Once in a blue moon", "Lego", "Rain check",
]
trials = 3
max_guesses = 3
extra_rounds = 2
concurrency = 15
spend_limit_usd = 3.0

[guesser]
model = "claude-haiku-5-5"
effort = "low"
