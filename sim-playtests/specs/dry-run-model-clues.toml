# Phase 1 dry run: model clue-giver and model guesser, to measure usage and speed and to check the clues.
# Pizza (humans solved in 1 step), Popcorn (humans failed), Break the ice (humans
# solved in 9 steps).
mode = "model-clues"
prompts = ["Pizza", "Popcorn", "Break the ice"]
trials = 1
max_rounds = 8
max_guesses = 3
concurrency = 15
spend_limit_usd = 3.0

[clue_giver]
model = "claude-sonnet-5-5"
effort = "medium"

[guesser]
model = "claude-haiku-5-5"
effort = "low"
