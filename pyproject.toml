[project]
name = "new-notions"
version = "0"
description = "Tools for New Notions, an unofficial fan expansion for Concept"
requires-python = ">=3.12"
dependencies = [
    "llmemo",
    "pypdf>=5.0",
    "pypdfium2>=4.0",
    "reportlab>=4.0",
]

[tool.uv]
# Scripts in tools/, not an installable package.
package = false

[tool.uv.sources]
llmemo = { git = "https://github.com/ForrestTrepte/llmemo", tag = "v0.2.0", subdirectory = "python" }

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "types-reportlab>=5.1.0.20261104",
]

[tool.mypy]
strict = true
files = ["tools", "tests"]

[[tool.mypy.overrides]]
# pypdfium2 ships no type information.
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
markers = [
    "llm: uses the LLM cache (replays by default; LLMEMO_MODE=record records misses)",
]
